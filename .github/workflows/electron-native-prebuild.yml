name: Electron native prebuild

on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/electron-native-prebuild.yml

permissions:
  contents: read

jobs:
  prebuild:
    name: Build Windows x64 SQLite addon
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite addon for Electron
        run: npm run electron:rebuild

      - name: Upload Electron native addon
        uses: actions/upload-artifact@v4
        with:
          name: better-sqlite3-electron-win32-x64
          path: node_modules/better-sqlite3/build/Release/better_sqlite3.node
          if-no-files-found: error
          retention-days: 30
