services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - ENVIRONMENT=prod
      - PORT=3001
      - SQLITE_DB_PATH=/app/data/opendevbot.sqlite
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - opendevbot-network

networks:
  opendevbot-network:
    driver: bridge
