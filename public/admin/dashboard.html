<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
  <title>OpenDevBot — Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #14121B;
      --panel: #1B1826;
      --panel-raised: #221E30;
      --line: #322C42;
      --text: #EDE9F5;
      --text-dim: #9A93AE;
      --accent: #FF5D5D;
      /* live / signal coral */
      --accent-soft: rgba(255, 93, 93, 0.14);
      --ok: #7FE7C4;
      --ok-soft: rgba(127, 231, 196, 0.12);
      --warn: #F3B95F;
      --warn-soft: rgba(243, 185, 95, 0.12);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Manrope', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(255, 93, 93, 0.07), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(127, 231, 196, 0.06), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    ::selection {
      background: var(--accent-soft);
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand .mark {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      padding: 5px 9px;
      border-radius: 6px;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .brand .sub {
      color: var(--text-dim);
      font-size: 12.5px;
      font-family: var(--mono);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .signal.online .dot {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
      animation: pulse 2s infinite;
    }

    .signal.online {
      color: var(--ok);
      border-color: rgba(127, 231, 196, 0.3);
    }

    /* Health indicator */
    .health {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text-dim);
    }

    .health .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .health.ok .dot {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
    }

    .health.err {
      color: var(--accent);
      border-color: rgba(255, 93, 93, 0.3);
    }

    .health.err .dot {
      background: var(--accent);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.45);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(127, 231, 196, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(127, 231, 196, 0);
      }
    }

    .btn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13.5px;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #1A1013;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(255, 93, 93, 0.35);
    }

    .btn-danger:hover {
      background: var(--accent-soft);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ---------- Top navigation ---------- */
    .main-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: 18px;
    }

    .nav-item {
      font-family: var(--mono);
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--bg);
      background: var(--text-dim);
      font-weight: 700;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .user-chip b {
      color: var(--text);
      font-weight: 600;
    }

    /* ---------- Layout ---------- */
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 22px;
      padding: 26px 32px 40px;
      max-width: 1180px;
      margin: 0 auto;
      align-items: start;
    }

    @media (max-width: 880px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .col-left {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-head .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .panel-head h2 {
      margin: 2px 0 0;
      font-size: 15.5px;
      font-weight: 800;
    }

    .panel-body {
      padding: 16px 18px 20px;
    }

    /* ---------- Channels ---------- */
    .join-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .join-row input {
      flex: 1;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 11px;
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
    }

    .join-row input:focus {
      border-color: var(--accent);
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .channel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
    }

    .channel-name {
      font-family: var(--mono);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-name .dot {
      background: var(--ok);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .icon-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .empty {
      color: var(--text-dim);
      font-size: 13px;
      font-family: var(--mono);
      padding: 18px 4px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    /* ---------- Webhook queue ---------- */
    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.4px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
    }

    .tab.active {
      color: var(--bg);
      background: var(--text-dim);
    }

    .tab.active.pending {
      background: var(--warn);
    }

    .tab.active.failed {
      background: var(--accent);
    }

    .tab.active.sent {
      background: var(--ok);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 10px 10px;
      border-bottom: 1px solid var(--line);
    }

    tbody td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .badge {
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }

    .badge.pending {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .badge.processing {
      color: var(--text-dim);
      background: rgba(154, 147, 174, 0.12);
    }

    .badge.sent {
      color: var(--ok);
      background: var(--ok-soft);
    }

    .badge.failed {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .mono-id {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .queue-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      margin-top: 4px;
      border-top: 1px solid var(--line);
    }

    .page-info {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }

    .pager {
      display: flex;
      gap: 6px;
    }

    /* ---------- Bot status ---------- */
    .status-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .status-row .label {
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .status-row .value {
      font-family: var(--mono);
      font-size: 13px;
    }

    .status-dot-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-dot.up {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
      animation: pulse 2s infinite;
    }

    .status-dot.down {
      background: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-raised);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue;

    createApp({
      setup() {
        // Falls back to demo data when not running inside the Electron shell,
        // so this page can also be opened directly for preview.
        const hasBridge = !!(window.twitchApi && window.adminApi);

        const connected = ref(false);
        const user = ref(null);
        const activeView = ref('dashboard');

        const channels = ref(['skullgaming31', 'opendevbot']);
        const joinInput = ref('');

        const status = ref('pending');
        const items = ref([
          { _id: 'a1b2c3', event: 'channel.follow', status: 'pending', createdAt: new Date().toISOString() },
          { _id: 'd4e5f6', event: 'channel.subscribe', status: 'failed', createdAt: new Date().toISOString() },
        ]);
        const page = ref(1);
        const limit = 10;
        const total = ref(items.value.length);
        const selected = ref(new Set());
        const toast = ref('');

        // Economy panel state
        const economyAccounts = ref([]);
        const economyTotal = ref(0);
        const economyPage = ref(1);
        const economyLimit = 20;

        async function loadEconomy() {
          if (!hasBridge) {
            // demo fallback
            economyAccounts.value = [
              { userId: '12345', balance: 5000, updatedAt: new Date().toISOString() },
              { userId: 'alice', balance: 1200, updatedAt: new Date().toISOString() },
            ];
            economyTotal.value = economyAccounts.value.length;
            return;
          }
          try {
            const res = await window.adminApi.fetch(`/api/v1/admin/economy/accounts?page=${economyPage.value}&limit=${economyLimit}`);
            economyAccounts.value = res.items || [];
            economyTotal.value = res.total || economyAccounts.value.length;
          } catch (e) {
            console.debug('Failed to load economy', e);
            economyAccounts.value = [];
            economyTotal.value = 0;
          }
        }

        async function editAccount(acc) {
          if (!hasBridge) { showToast('Edit requires the Electron shell'); return; }
          try {
            const current = acc.balance || {};
            // Prefer the native modal bridge when available (Electron)
            let result = null;
            if (window.adminModalEdit && typeof window.adminModalEdit.show === 'function') {
              result = await window.adminModalEdit.show({ userId: acc.userId, bank: Number(current.bank ?? 0), wallet: Number(current.wallet ?? 0) });
            } else {
              // fallback for browser preview: use prompt()
              const bank = prompt('Bank amount', String(current.bank ?? current ?? 0));
              if (bank === null) return;
              const wallet = prompt('Wallet amount', String((current.wallet ?? 0)));
              if (wallet === null) return;
              result = { bank: Number(bank), wallet: Number(wallet) };
            }
            if (!result) return; // cancelled
            const body = { bank: Number(result.bank || 0), wallet: Number(result.wallet || 0) };
            if (Number.isNaN(body.bank) || Number.isNaN(body.wallet)) { showToast('Invalid amounts'); return; }
            await window.adminApi.fetch(`/api/v1/admin/economy/account/${acc.userId}`, { method: 'PUT', body: JSON.stringify(body) });
            showToast('Account updated');
            await loadEconomy();
          } catch (e) { console.error(e); showToast('Failed to update account'); }
        }

        async function deleteAccount(userId) {
          if (!hasBridge) { showToast('Delete requires the Electron shell'); return; }
          // show modal confirmation
          try {
            const ok = await showConfirmModal(`Delete account ${userId}? This cannot be undone.`);
            if (!ok) return;
            await window.adminApi.fetch(`/api/v1/admin/economy/account/${userId}`, { method: 'DELETE' });
            showToast('Account deleted');
            await loadEconomy();
          } catch (e) { console.error(e); showToast('Failed to delete account'); }
        }

        // Modal helpers
        const modalVisible = ref(false);
        const modalMessage = ref('');
        function showModal(msg) { modalMessage.value = msg; modalVisible.value = true; }
        function hideModal() { modalVisible.value = false; modalMessage.value = ''; }
        function showConfirmModal(msg) {
          return new Promise(resolve => {
            modalMessage.value = msg;
            modalVisible.value = true;
            const okHandler = () => { cleanup(); resolve(true); };
            const cancelHandler = () => { cleanup(); resolve(false); };
            function cleanup() { hideModal(); document.removeEventListener('adminModalOk', okHandler); document.removeEventListener('adminModalCancel', cancelHandler); }
            document.addEventListener('adminModalOk', okHandler);
            document.addEventListener('adminModalCancel', cancelHandler);
          });
        }


        function showToast(msg) {
          toast.value = msg;
          setTimeout(() => { toast.value = ''; }, 2400);
        }

        function signUp(type = 'user') {
          if (!hasBridge) { showToast('Sign-up requires the Electron shell'); return; }
          window.twitchApi.signup(type);
        }

        function openLogs() {
          if (!hasBridge || !window.logsApi) { showToast('Logs require the Electron shell'); return; }
          window.logsApi.openWindow();
        }

        async function loadChannels() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch('/api/v1/chat/channels');
            channels.value = res.channels || [];
          } catch (e) {
            console.debug('Failed to load channels', e);
            channels.value = [];
          }
        }

        async function joinChannel() {
          const name = joinInput.value.trim().toLowerCase();
          if (!name) return;
          if (!hasBridge) { channels.value.push(name); joinInput.value = ''; return; }
          await window.adminApi.fetch('/api/v1/chat/join', { method: 'POST', body: JSON.stringify({ username: name }) });
          joinInput.value = '';
          await loadChannels();
          showToast(`Joined #${name}`);
        }

        async function partChannel(name) {
          if (!hasBridge) { channels.value = channels.value.filter(c => c !== name); return; }
          await window.adminApi.fetch('/api/v1/chat/part', { method: 'POST', body: JSON.stringify({ username: name }) });
          await loadChannels();
          showToast(`Left #${name}`);
        }

        async function loadQueue() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch(`/api/v1/admin/webhooks?status=${status.value}&page=${page.value}&limit=${limit}`);
            items.value = res.items || [];
            total.value = (res.total ?? items.value.length);
          } catch (e) {
            console.debug('Failed to load queue', e);
            items.value = [];
            total.value = 0;
          }
        }

        // ---- EventSub subscriptions panel state + loader
        const esItems = ref([]);
        const esTotal = ref(0);
        const esPage = ref(1);
        const esLimit = 10;
        const esTotalPages = computed(() => Math.max(1, Math.ceil((esTotal.value || esItems.value.length) / esLimit)));
        const esPageItems = computed(() => {
          const start = (esPage.value - 1) * esLimit;
          return esItems.value.slice(start, start + esLimit);
        });

        async function loadEventSubs() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch('/api/v1/admin/eventsubs');
            esItems.value = res.items || [];
            esTotal.value = res.total || esItems.value.length;
            esPage.value = 1;
          } catch (e) {
            // ignore; keep previous state
            console.debug('Failed to load eventsubs', e);
          }
        }

        // Live monitor feed state
        const monitorFeed = ref([]);

        const defaultMonitorSettings = {
          bitsThreshold: 50,
          totalMax: 500,
          perEventMax: {
            chat: 200,
            follow: 100,
            subscription: 100,
            resub: 100,
            gift: 100,
            cheer: 100,
            raid: 50,
            redemption: 100,
            goal: 50,
            warning: 100,
          }
          ,
          perEventVisible: {
            chat: true,
            follow: true,
            subscription: true,
            resub: true,
            gift: true,
            cheer: true,
            raid: true,
            redemption: true,
            goal: true,
            warning: true,
            streamOnline: true,
            streamOffline: true
          }
        };

        const monitorSettings = ref((() => {
          try {
            const raw = localStorage.getItem('odb.monitorSettings');
            if (raw) {
              const parsed = JSON.parse(raw) || {};
              // merge shallow defaults for missing nested maps to avoid template errors
              parsed.perEventMax = Object.assign({}, defaultMonitorSettings.perEventMax, parsed.perEventMax || {});
              parsed.perEventVisible = Object.assign({}, defaultMonitorSettings.perEventVisible, parsed.perEventVisible || {});
              parsed.bitsThreshold = (parsed.bitsThreshold ?? defaultMonitorSettings.bitsThreshold);
              parsed.totalMax = (parsed.totalMax ?? defaultMonitorSettings.totalMax);
              return parsed;
            }
          } catch (e) { /* ignore */ }
          return JSON.parse(JSON.stringify(defaultMonitorSettings));
        })());

        function saveMonitorSettings() {
          try { localStorage.setItem('odb.monitorSettings', JSON.stringify(monitorSettings.value)); showToast('Monitor settings saved'); } catch (e) { showToast('Failed to save settings'); }
          try { if (hasBridge && window.monitorApi && typeof window.monitorApi.setVisibility === 'function') window.monitorApi.setVisibility(monitorSettings.value.perEventVisible || {}); } catch (e) { /* ignore */ }
        }

        // Admin API token settings (persisted to localStorage and sent to main process)
        const adminToken = ref('');

        async function loadAdminToken() {
          try {
            // Prefer token provided by main process if available
            if (hasBridge && window.adminApi && typeof window.adminApi.getToken === 'function') {
              const t = await window.adminApi.getToken();
              adminToken.value = t || (localStorage.getItem('odb.adminToken') || '');
            } else {
              adminToken.value = localStorage.getItem('odb.adminToken') || '';
            }
          } catch (e) { adminToken.value = localStorage.getItem('odb.adminToken') || ''; }
        }

        async function saveAdminToken() {
          try {
            localStorage.setItem('odb.adminToken', adminToken.value || '');
            if (hasBridge && window.adminApi && typeof window.adminApi.setToken === 'function') await window.adminApi.setToken(adminToken.value || '');
            showToast('Admin token saved');
          } catch (e) { showToast('Failed to save admin token'); }
        }

        async function clearAdminToken() {
          adminToken.value = '';
          try {
            localStorage.removeItem('odb.adminToken');
            if (hasBridge && window.adminApi && typeof window.adminApi.setToken === 'function') await window.adminApi.setToken('');
            showToast('Admin token cleared');
          } catch (e) { showToast('Failed to clear admin token'); }
        }

        function showAllEvents() {
          if (!monitorSettings.value.perEventVisible) monitorSettings.value.perEventVisible = {};
          Object.keys(monitorSettings.value.perEventVisible).forEach(k => { monitorSettings.value.perEventVisible[k] = true; });
        }

        function hideAllEvents() {
          if (!monitorSettings.value.perEventVisible) monitorSettings.value.perEventVisible = {};
          Object.keys(monitorSettings.value.perEventVisible).forEach(k => { monitorSettings.value.perEventVisible[k] = false; });
        }

        function resetMonitorSettings() {
          monitorSettings.value = JSON.parse(JSON.stringify(defaultMonitorSettings));
          saveMonitorSettings();
        }

        function eventKey(ev) { try { return String(ev).split(':').pop() || String(ev); } catch { return String(ev); } }
        // derive a normalized event type key used for visibility and per-event limits
        function eventTypeKey(ev) { try { return eventType(ev); } catch { return eventKey(ev); } }

        function pushMonitor(entry) {
          const key = eventTypeKey(entry.event);
          // skip if this event type is hidden
          try {
            if (monitorSettings.value && monitorSettings.value.perEventVisible && monitorSettings.value.perEventVisible[key] === false) return;
          } catch { }
          // bits threshold for cheers
          try {
            if (key === 'cheer') {
              const bits = Number((entry.payload && (entry.payload.bits ?? entry.payload.bitAmount)) || entry.bits || 0) || 0;
              if (bits < (monitorSettings.value.bitsThreshold || 0)) return;
            }
          } catch { /* ignore */ }

          // enforce per-event max (remove oldest matching entries)
          const limit = (monitorSettings.value.perEventMax && (monitorSettings.value.perEventMax[key] ?? monitorSettings.value.perEventMax['default'])) ?? 200;
          if (typeof limit === 'number' && limit >= 0) {
            let count = monitorFeed.value.filter(m => eventKey(m.event) === key).length;
            while (count >= limit) {
              let removed = false;
              for (let i = monitorFeed.value.length - 1; i >= 0; i--) {
                if (eventKey(monitorFeed.value[i].event) === key) { monitorFeed.value.splice(i, 1); removed = true; count--; break; }
              }
              if (!removed) break;
            }
          }

          monitorFeed.value.unshift(entry);

          // enforce total max
          const totalMax = Number(monitorSettings.value.totalMax || 500) || 500;
          while (monitorFeed.value.length > totalMax) monitorFeed.value.pop();
        }

        if (hasBridge && window.monitorApi) {
          window.monitorApi.onEvent((entry) => {
            // Friendly summaries for common events
            let summary = '';
            try {
              if (entry && entry.event === 'chat:message' && entry.payload) {
                const p = entry.payload || {};
                const name = p.displayName || p.user || p.username || 'unknown';
                const text = (p.text ?? p.message ?? '').toString();
                summary = `${name}: ${text}`;
              } else if (entry && typeof entry.payload === 'object') {
                summary = `${entry.timestamp} · ${entry.event} · ${JSON.stringify(entry.payload)}`;
              } else {
                summary = `${entry.timestamp} · ${entry.event} · ${String(entry.payload ?? '')}`;
              }
            } catch (e) {
              summary = `${entry.timestamp} · ${entry.event} · ${JSON.stringify(entry.payload)}`;
            }
            pushMonitor({ text: summary, ts: entry.timestamp, event: entry.event, payload: entry.payload });
          });
        }

        function clearMonitor() { monitorFeed.value = []; showToast('Monitor cleared'); }

        function eventType(ev) {
          const s = String(ev || '');
          const parts = s.split(':');
          if (parts.length === 1) return parts[0] || 'unknown';
          if (parts[0] === 'chat') return 'chat';
          if (parts[0].startsWith('eventsub')) return parts[1] || parts[0];
          return parts[1] || parts[0];
        }

        function eventIcon(ev) {
          const k = eventType(ev);
          const map = {
            chat: '💬', follow: '➕', subscription: '⭐', resub: '🔁', gift: '🎁', cheer: '✨', raid: '🚩',
            redemption: '🎯', goal: '🏆', warning: '⚠️', streamOnline: '🟢', streamOffline: '⚫️', default: '•'
          };
          return map[k] || map.default;
        }

        function eventColor(ev) {

            chat: '#f5f7fa', follow: '#e8f5e9', subscription: '#fff8e1', resub: '#fff3e0', gift: '#f3e5f5',

          showToast(`Deleted ${ids.length} item${ids.length > 1 ? 's' : ''}`);

        const totalPages = computed(() => Math.max(1, Math.ceil(total.value / limit)));

        function fmtTime(iso) {
          return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // API health is now part of the botStatus object and checked in loadStatus

        const liveUptimeSeconds = ref(0);

        function formatUptime(totalSeconds) {
          const s = Math.max(0, Math.floor(totalSeconds));
          const d = Math.floor(s / 86400);
          const h = Math.floor((s % 86400) / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = s % 60;
          if (d > 0) return `${d}d ${h}h ${m}m`;
          if (h > 0) return `${h}h ${m}m`;
          if (m > 0) return `${m}m ${sec}s`;
          return `${sec}s`;
        }

          if (!hasBridge) {

            botStatus.value = {

              chatConnected: true,

            };
            liveUptimeSeconds.value = 3 * 3600;
            return;
          }
          try {

            botStatus.value = res;
            liveUptimeSeconds.value = res.uptimeSeconds;
          } catch (err) {
            botStatus.value = { ...botStatus.value, dbConnected: false, chatConnected: false };
          }
        }

        let refreshInterval = null;
        onMounted(() => {
          if (hasBridge) {
            window.twitchApi.onSignupComplete((result) => {
              connected.value = true;
              user.value = result;
              showToast(`Signed up as ${result.username}`);

          }, 60 * 1000);

          // Load persisted admin token (if any)
          try { loadAdminToken(); } catch (e) { /* ignore */ }
        });

        onUnmounted(() => {
          if (refreshInterval) clearInterval(refreshInterval);
        });

              <tbody>
                <tr v-for="acc in economyAccounts" :key="acc.userId">
                  <td class="mono-id">{{ acc.userId }}</td>
                  <td>
                    {{ (acc.balance && typeof acc.balance === 'object' && acc.balance.bank != null)
                        ? (String(acc.balance.bank) + ' / ' + String(acc.balance.wallet ?? 0))
                        : String(acc.balance ?? '') }}
                  </td>
                  <td>
                    <button class="btn small" @click="editAccount(acc)">Edit</button>
                    <button class="btn small danger" @click="deleteAccount(acc.userId)">Delete</button>
                  </td>
                  <td class="mono-id">{{ new Date(acc.updatedAt).toLocaleString() }}</td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">No economy data available. Ensure the admin API exposes /api/v1/admin/economy/accounts</div>
          </div>
        </section>
      </div>
    </main>

    <div class="toast" v-if="toast">{{ toast }}</div>
  `
    }).mount('#app');
  </script>

  <!-- Simple modal markup -->
  <div id="admin-modal"
    style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:1000;">
    <div style="background:rgba(0,0,0,0.75); position:absolute; inset:0;"></div>
    <div
      style="position:relative; background:var(--panel); color:var(--text); padding:18px; width:420px; border-radius:10px; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,0.6);">
      <div id="admin-modal-message" style="color:var(--text-dim); font-size:14px;"></div>
      <div style="margin-top:14px; text-align:right;">
        <button id="admin-modal-cancel" class="btn" style="margin-right:8px;">Cancel</button>
        <button id="admin-modal-ok" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>
  <script>
    // Simple bridge between modal DOM and Vue event flow
    (function () {
      const modal = document.getElementById('admin-modal');
      const msg = document.getElementById('admin-modal-message');
      const ok = document.getElementById('admin-modal-ok');
      const cancel = document.getElementById('admin-modal-cancel');
      function show(m) { msg.textContent = String(m || ''); modal.style.display = 'flex'; }
      function hide() { modal.style.display = 'none'; msg.textContent = ''; }
      ok.addEventListener('click', () => { document.dispatchEvent(new CustomEvent('adminModalOk')); hide(); });
      cancel.addEventListener('click', () => { document.dispatchEvent(new CustomEvent('adminModalCancel')); hide(); });
      // expose helpers for Vue
      window.adminModal = { show, hide };
      // wire to Vue reactive modal state
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => { });
      });
    })();
  </script>
  <!-- Edit modal markup -->
  <div id="admin-edit-modal"
    style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:1000;">
    <div style="background:rgba(0,0,0,0.75); position:absolute; inset:0;"></div>
    <div
      style="position:relative; background:var(--panel); color:var(--text); padding:18px; width:420px; border-radius:10px; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,0.6);">
      <div style="font-weight:700;margin-bottom:6px;color:var(--text-dim)">Edit Account</div>
      <div id="admin-edit-user" style="font-size:13px;color:var(--text-dim);margin-bottom:8px"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label style="width:80px;font-family:var(--mono);color:var(--text-dim)">Bank</label>
        <input id="admin-edit-bank" type="number"
          style="flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-raised);color:var(--text)" />
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label style="width:80px;font-family:var(--mono);color:var(--text-dim)">Wallet</label>
        <input id="admin-edit-wallet" type="number"
          style="flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-raised);color:var(--text)" />
      </div>
      <div style="text-align:right;margin-top:12px">
        <button id="admin-edit-cancel" class="btn" style="margin-right:8px;">Cancel</button>
        <button id="admin-edit-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const modal = document.getElementById('admin-edit-modal');
      const userEl = document.getElementById('admin-edit-user');
      const bankInput = document.getElementById('admin-edit-bank');
      const walletInput = document.getElementById('admin-edit-wallet');
      const ok = document.getElementById('admin-edit-save');
      const cancel = document.getElementById('admin-edit-cancel');
      let pendingResolve = null;
      function show(opts) {
        userEl.textContent = `User: ${opts.userId}`;
        bankInput.value = String(opts.bank || 0);
        walletInput.value = String(opts.wallet || 0);
        modal.style.display = 'flex';
        return new Promise(resolve => {
          pendingResolve = resolve;
        });
      }
      function hide() { modal.style.display = 'none'; if (pendingResolve) { pendingResolve(null); pendingResolve = null; } }
      ok.addEventListener('click', () => {
        const bank = Number(bankInput.value || 0);
        const wallet = Number(walletInput.value || 0);
        if (!Number.isFinite(bank) || !Number.isFinite(wallet)) { alert('Invalid amounts'); return; }
        modal.style.display = 'none';
        if (pendingResolve) { pendingResolve({ bank, wallet }); pendingResolve = null; }
      });
      cancel.addEventListener('click', () => { modal.style.display = 'none'; if (pendingResolve) { pendingResolve(null); pendingResolve = null; } });
      window.adminModalEdit = { show, hide };
    })();
  </script>
</body>

</html>
