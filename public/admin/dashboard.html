<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
  <title>OpenDevBot — Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #14121B;
      --panel: #1B1826;
      --panel-raised: #221E30;
      --line: #322C42;
      --text: #EDE9F5;
      --text-dim: #9A93AE;
      --accent: #FF5D5D;
      /* live / signal coral */
      --accent-soft: rgba(255, 93, 93, 0.14);
      --ok: #7FE7C4;
      --ok-soft: rgba(127, 231, 196, 0.12);
      --warn: #F3B95F;
      --warn-soft: rgba(243, 185, 95, 0.12);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Manrope', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(255, 93, 93, 0.07), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(127, 231, 196, 0.06), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    ::selection {
      background: var(--accent-soft);
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand .mark {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      padding: 5px 9px;
      border-radius: 6px;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .brand .sub {
      color: var(--text-dim);
      font-size: 12.5px;
      font-family: var(--mono);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .signal.online .dot {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
      animation: pulse 2s infinite;
    }

    .signal.online {
      color: var(--ok);
      border-color: rgba(127, 231, 196, 0.3);
    }

    /* Health indicator */
    .health {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text-dim);
    }

    .health .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .health.ok .dot {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
    }

    .health.err {
      color: var(--accent);
      border-color: rgba(255, 93, 93, 0.3);
    }

    .health.err .dot {
      background: var(--accent);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.45);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(127, 231, 196, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(127, 231, 196, 0);
      }
    }

    .btn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13.5px;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #1A1013;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(255, 93, 93, 0.35);
    }

    .btn-danger:hover {
      background: var(--accent-soft);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ---------- Top navigation ---------- */
    .main-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: 18px;
    }

    .nav-item {
      font-family: var(--mono);
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--bg);
      background: var(--text-dim);
      font-weight: 700;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .signup-status {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signup-status .user-chip,
    .signup-status .btn {
      width: 100%;
      justify-content: flex-start;
    }

    .account-action {
      padding: 4px 8px;
      margin-left: auto;
      font-size: 11px;
    }

    .user-chip b {
      color: var(--text);
      font-weight: 600;
    }

    /* ---------- Layout ---------- */
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 22px;
      padding: 26px 32px 40px;
      max-width: 1180px;
      margin: 0 auto;
      align-items: start;
    }

    main.live-main {
      grid-template-columns: minmax(0, 1fr);
    }

    @media (max-width: 880px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .col-left {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-head .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .panel-head h2 {
      margin: 2px 0 0;
      font-size: 15.5px;
      font-weight: 800;
    }

    .panel-body {
      padding: 16px 18px 20px;
    }

    /* ---------- Channels ---------- */
    .join-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .join-row input {
      flex: 1;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 11px;
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
    }

    .join-row input:focus {
      border-color: var(--accent);
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .channel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
    }

    .channel-name {
      font-family: var(--mono);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-name .dot {
      background: var(--ok);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .icon-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .empty {
      color: var(--text-dim);
      font-size: 13px;
      font-family: var(--mono);
      padding: 18px 4px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    /* ---------- Webhook queue ---------- */
    .tabs {
      display: flex;
      gap: 6px;
    }

    .live-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .live-feed {
      max-height: 70vh;
      overflow: auto;
      padding: 12px;
    }

    @media (max-width: 800px) {
      .live-grid {
        grid-template-columns: 1fr;
      }
    }

    .tab {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.4px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
    }

    .tab.active {
      color: var(--bg);
      background: var(--text-dim);
    }

    .tab.active.pending {
      background: var(--warn);
    }

    .tab.active.failed {
      background: var(--accent);
    }

    .tab.active.sent {
      background: var(--ok);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 10px 10px;
      border-bottom: 1px solid var(--line);
    }

    tbody td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .badge {
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }

    .badge.pending {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .badge.processing {
      color: var(--text-dim);
      background: rgba(154, 147, 174, 0.12);
    }

    .badge.sent {
      color: var(--ok);
      background: var(--ok-soft);
    }

    .badge.failed {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .mono-id {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .queue-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      margin-top: 4px;
      border-top: 1px solid var(--line);
    }

    .page-info {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }

    .pager {
      display: flex;
      gap: 6px;
    }

    /* ---------- Bot status ---------- */
    .status-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .status-row .label {
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .status-row .value {
      font-family: var(--mono);
      font-size: 13px;
    }

    .status-dot-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-dot.up {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
      animation: pulse 2s infinite;
    }

    .status-dot.down {
      background: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-raised);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue;

    createApp({
      setup() {
        // Falls back to demo data when not running inside the Electron shell,
        // so this page can also be opened directly for preview.
        const hasBridge = !!(window.twitchApi && window.adminApi);

        const userSignup = ref(null);
        const botSignup = ref(null);
        const activeView = ref('dashboard');

        const channels = ref(['skullgaming31', 'opendevbot']);
        const joinInput = ref('');

        const status = ref('pending');
        const queueTestSubmitting = ref(false);
        const items = ref([
          { _id: 'a1b2c3', event: 'channel.follow', status: 'pending', createdAt: new Date().toISOString() },
          { _id: 'd4e5f6', event: 'channel.subscribe', status: 'failed', createdAt: new Date().toISOString() },
        ]);
        const page = ref(1);
        const limit = 10;
        const total = ref(items.value.length);
        const selected = ref(new Set());
        const toast = ref('');

        // Economy panel state
        const economyAccounts = ref([]);
        const economyTotal = ref(0);
        const economyPage = ref(1);
        const economyLimit = 20;
        const economyError = ref('');
        const economyLoading = ref(false);
        const economyPageCount = computed(() => Math.max(1, Math.ceil(economyTotal.value / economyLimit)));

        async function loadEconomy() {
          economyError.value = '';
          economyLoading.value = true;
          if (!hasBridge) {
            // demo fallback
            economyAccounts.value = [
              { userId: '12345', balance: 5000, updatedAt: new Date().toISOString() },
              { userId: 'alice', balance: 1200, updatedAt: new Date().toISOString() },
            ];
            economyTotal.value = economyAccounts.value.length;
            economyLoading.value = false;
            return;
          }
          try {
            const res = await window.adminApi.fetch(`/api/v1/admin/economy/accounts?page=${economyPage.value}&limit=${economyLimit}`);
            if (res && res.error) throw new Error(res.error);
            economyAccounts.value = res.items || [];
            economyTotal.value = Number.isFinite(Number(res.total)) ? Number(res.total) : economyAccounts.value.length;
            if (economyPage.value > economyPageCount.value) {
              economyPage.value = economyPageCount.value;
              return await loadEconomy();
            }
          } catch (e) {
            console.error('Failed to load economy', e);
            economyAccounts.value = [];
            economyTotal.value = 0;
            economyError.value = e instanceof Error ? e.message : String(e);
          } finally {
            economyLoading.value = false;
          }
        }

        async function editAccount(acc) {
          if (!hasBridge) { showToast('Edit requires the Electron shell'); return; }
          try {
            const current = acc.balance || {};
            // Prefer the native modal bridge when available (Electron)
            let result = null;
            if (window.adminModalEdit && typeof window.adminModalEdit.show === 'function') {
              result = await window.adminModalEdit.show({ userId: acc.userId, bank: Number(current.bank ?? 0), wallet: Number(current.wallet ?? 0) });
            } else {
              // fallback for browser preview: use prompt()
              const bank = prompt('Bank amount', String(current.bank ?? current ?? 0));
              if (bank === null) return;
              const wallet = prompt('Wallet amount', String((current.wallet ?? 0)));
              if (wallet === null) return;
              result = { bank: Number(bank), wallet: Number(wallet) };
            }
            if (!result) return; // cancelled
            const body = { bank: Number(result.bank || 0), wallet: Number(result.wallet || 0) };
            if (Number.isNaN(body.bank) || Number.isNaN(body.wallet)) { showToast('Invalid amounts'); return; }
            await window.adminApi.fetch(`/api/v1/admin/economy/account/${acc.userId}`, { method: 'PUT', body: JSON.stringify(body) });
            showToast('Account updated');
            await loadEconomy();
          } catch (e) { console.error(e); showToast('Failed to update account'); }
        }

        async function deleteAccount(userId) {
          if (!hasBridge) { showToast('Delete requires the Electron shell'); return; }
          // show modal confirmation
          try {
            const ok = await showConfirmModal(`Delete account ${userId}? This cannot be undone.`);
            if (!ok) return;
            await window.adminApi.fetch(`/api/v1/admin/economy/account/${userId}`, { method: 'DELETE' });
            showToast('Account deleted');
            await loadEconomy();
          } catch (e) { console.error(e); showToast('Failed to delete account'); }
        }

        // Modal helpers
        const modalVisible = ref(false);
        const modalMessage = ref('');
        function showModal(msg) { modalMessage.value = msg; modalVisible.value = true; }
        function hideModal() { modalVisible.value = false; modalMessage.value = ''; }
        function showConfirmModal(msg) {
          return new Promise(resolve => {
            // Prefer the native modal bridge when available (Electron)
            if (window.adminModal && typeof window.adminModal.show === 'function') {
              const okHandler = () => { cleanup(); resolve(true); };
              const cancelHandler = () => { cleanup(); resolve(false); };
              function cleanup() { document.removeEventListener('adminModalOk', okHandler); document.removeEventListener('adminModalCancel', cancelHandler); }
              document.addEventListener('adminModalOk', okHandler);
              document.addEventListener('adminModalCancel', cancelHandler);
              try { window.adminModal.show(msg); } catch (e) { cleanup(); resolve(false); }
              return;
            }

            // Fallback to the reactive in-Vue modal (used in some previews)
            modalMessage.value = msg;
            modalVisible.value = true;
            const okHandler = () => { cleanup(); resolve(true); };
            const cancelHandler = () => { cleanup(); resolve(false); };
            function cleanup() { hideModal(); document.removeEventListener('adminModalOk', okHandler); document.removeEventListener('adminModalCancel', cancelHandler); }
            document.addEventListener('adminModalOk', okHandler);
            document.addEventListener('adminModalCancel', cancelHandler);
          });
        }


        function showToast(msg) {
          toast.value = msg;
          setTimeout(() => { toast.value = ''; }, 2400);
        }

        function signUp(type = 'user') {
          if (!hasBridge) { showToast('Sign-up requires the Electron shell'); return; }
          window.twitchApi.signup(type);
        }

        function openLogs() {
          if (!hasBridge || !window.logsApi) { showToast('Logs require the Electron shell'); return; }
          window.logsApi.openWindow();
        }

        async function loadChannels() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch('/api/v1/chat/channels');
            channels.value = res.channels || [];
          } catch (e) {
            console.debug('Failed to load channels', e);
            channels.value = [];
          }
        }

        async function loadSignupAccounts() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch('/api/v1/admin/twitch/accounts');
            if (res && res.error) throw new Error(res.error);
            userSignup.value = res.streamer || null;
            botSignup.value = res.bot || null;
          } catch (e) {
            console.error('Failed to load Twitch signup accounts', e);
          }
        }

        const accountActionPending = ref('');

        async function changeSignupAccount(type, revoke) {
          const account = type === 'bot' ? botSignup.value : userSignup.value;
          if (!hasBridge || !account?.userId || accountActionPending.value) return;
          const actionLabel = revoke ? 'revoke' : 'sign out';
          const confirmation = revoke
            ? `Revoke ${type} access for ${account.username} with Twitch? This invalidates the saved access and refresh tokens.`
            : `Sign out ${type} account ${account.username} from this app? Its Twitch authorization will remain active.`;
          if (!await showConfirmModal(confirmation)) return;

          accountActionPending.value = `${type}:${actionLabel}`;
          try {
            const suffix = revoke ? '/revoke' : '';
            const response = await window.adminApi.fetch(
              `/api/v1/admin/twitch/accounts/${encodeURIComponent(account.userId)}${suffix}`,
              { method: revoke ? 'POST' : 'DELETE' }
            );
            if (response && response.error) {
              if (response.removed) await loadSignupAccounts();
              throw new Error(response.error);
            }
            await Promise.all([loadSignupAccounts(), loadChannels()]);
            showToast(`${type} account ${revoke ? 'revoked from Twitch' : 'signed out'}`);
          } catch (e) {
            console.error(`Failed to ${actionLabel} ${type} Twitch account`, e);
            showToast(e instanceof Error ? e.message : `Failed to ${actionLabel} ${type} account`);
          } finally {
            accountActionPending.value = '';
          }
        }

        function signOutAccount(type) {
          return changeSignupAccount(type, false);
        }

        function revokeAccount(type) {
          return changeSignupAccount(type, true);
        }

        async function joinChannel() {
          const name = joinInput.value.trim().toLowerCase();
          if (!name) return;
          if (!hasBridge) { channels.value.push(name); joinInput.value = ''; return; }
          await window.adminApi.fetch('/api/v1/chat/join', { method: 'POST', body: JSON.stringify({ username: name }) });
          joinInput.value = '';
          await loadChannels();
          showToast(`Joined #${name}`);
        }

        async function partChannel(name) {
          if (!hasBridge) { channels.value = channels.value.filter(c => c !== name); return; }
          await window.adminApi.fetch('/api/v1/chat/part', { method: 'POST', body: JSON.stringify({ username: name }) });
          await loadChannels();
          showToast(`Left #${name}`);
        }

        async function loadQueue() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch(`/api/v1/admin/webhooks?status=${status.value}&page=${page.value}&limit=${limit}`);
            items.value = res.items || [];
            total.value = (res.total ?? items.value.length);
          } catch (e) {
            console.debug('Failed to load queue', e);
            items.value = [];
            total.value = 0;
          }
        }

        async function queueDryRunSamples() {
          if (!hasBridge) { showToast('Queue testing requires the Electron shell'); return; }
          queueTestSubmitting.value = true;
          try {
            const result = await window.adminApi.fetch('/api/v1/admin/webhooks/test-queue', { method: 'POST' });
            if (!result?.ok || typeof result.queued !== 'number') {
              throw new Error(result?.error || 'Webhook queue sample request failed');
            }
            status.value = 'pending';
            page.value = 1;
            await loadQueue();
            showToast(`Queued ${result.queued} dry-run items; nothing was sent to Discord`);
          } catch (e) {
            console.error(e);
            showToast(e instanceof Error ? e.message : 'Failed to queue dry-run samples');
          } finally {
            queueTestSubmitting.value = false;
          }
        }

        // ---- EventSub subscriptions panel state + loader
        const esItems = ref([]);
        const esTotal = ref(0);
        const esPage = ref(1);
        const esLimit = 10;
        const esTotalPages = computed(() => Math.max(1, Math.ceil((esTotal.value || esItems.value.length) / esLimit)));
        const esPageItems = computed(() => {
          const start = (esPage.value - 1) * esLimit;
          return esItems.value.slice(start, start + esLimit);
        });

        async function loadEventSubs() {
          if (!hasBridge) return;
          try {
            const res = await window.adminApi.fetch('/api/v1/admin/eventsubs');
            esItems.value = res.items || [];
            esTotal.value = res.total || esItems.value.length;
            esPage.value = 1;
          } catch (e) {
            // ignore; keep previous state
            console.debug('Failed to load eventsubs', e);
          }
        }

        // Live monitor feed state
        const monitorFeed = ref([]);
        const chatFeed = computed(() => monitorFeed.value.filter(entry => eventType(entry.event) === 'chat'));
        const eventMonitorFeed = computed(() => monitorFeed.value.filter(entry => eventType(entry.event) !== 'chat'));

        const defaultMonitorSettings = {
          bitsThreshold: 50,
          totalMax: 500,
          perEventMax: {
            chat: 200,
            follow: 100,
            subscription: 100,
            resub: 100,
            gift: 100,
            cheer: 100,
            raid: 50,
            redemption: 100,
            goal: 50,
            warning: 100,
          }
          ,
          perEventVisible: {
            chat: true,
            follow: true,
            subscription: true,
            resub: true,
            gift: true,
            cheer: true,
            raid: true,
            redemption: true,
            goal: true,
            warning: true,
            streamOnline: true,
            streamOffline: true
          }
        };

        function normalizeMonitorSettings(settings) {
          const parsed = settings && typeof settings === 'object' ? settings : {};
          return {
            bitsThreshold: parsed.bitsThreshold ?? defaultMonitorSettings.bitsThreshold,
            totalMax: parsed.totalMax ?? defaultMonitorSettings.totalMax,
            perEventMax: Object.assign({}, defaultMonitorSettings.perEventMax, parsed.perEventMax || {}),
            perEventVisible: Object.assign({}, defaultMonitorSettings.perEventVisible, parsed.perEventVisible || {}),
          };
        }

        const monitorSettings = ref((() => {
          try {
            const raw = localStorage.getItem('odb.monitorSettings');
            if (raw) return normalizeMonitorSettings(JSON.parse(raw));
          } catch (e) { /* ignore */ }
          return JSON.parse(JSON.stringify(defaultMonitorSettings));
        })());

        const settingsError = ref('');

        async function loadMonitorSettings() {
          if (!hasBridge) return;
          try {
            const response = await window.adminApi.fetch('/api/v1/admin/settings/monitor');
            if (response && response.error) throw new Error(response.error);
            if (response && response.settings) {
              monitorSettings.value = normalizeMonitorSettings(response.settings);
            } else {
              monitorSettings.value = normalizeMonitorSettings(monitorSettings.value);
              await saveMonitorSettings();
              return;
            }
            settingsError.value = '';
            localStorage.setItem('odb.monitorSettings', JSON.stringify(monitorSettings.value));
            if (window.monitorApi && typeof window.monitorApi.setVisibility === 'function') {
              window.monitorApi.setVisibility(JSON.stringify(monitorSettings.value.perEventVisible || {}));
            }
          } catch (e) {
            console.error('Failed to load monitor settings', e);
            settingsError.value = e instanceof Error ? e.message : String(e);
          }
        }

        async function saveMonitorSettings() {
          try {
            monitorSettings.value = normalizeMonitorSettings(monitorSettings.value);
            if (hasBridge) {
              const response = await window.adminApi.fetch('/api/v1/admin/settings/monitor', {
                method: 'PUT',
                body: JSON.stringify(monitorSettings.value),
              });
              if (response && response.error) throw new Error(response.error);
              if (response && response.settings) monitorSettings.value = normalizeMonitorSettings(response.settings);
            }
            localStorage.setItem('odb.monitorSettings', JSON.stringify(monitorSettings.value));
            settingsError.value = '';
            showToast('Monitor settings saved');
          } catch (e) {
            console.error('Failed to save monitor settings', e);
            settingsError.value = e instanceof Error ? e.message : String(e);
            showToast('Failed to save settings');
          }
          try { if (hasBridge && window.monitorApi && typeof window.monitorApi.setVisibility === 'function') window.monitorApi.setVisibility(JSON.stringify(monitorSettings.value.perEventVisible || {})); } catch (e) { /* ignore */ }
        }

        // Admin API token settings (persisted to localStorage and sent to main process)
        const adminToken = ref('');

        async function loadAdminToken() {
          try {
            // Prefer token provided by main process if available
            let token = '';
            if (hasBridge && window.adminApi && typeof window.adminApi.getToken === 'function') {
              token = (await window.adminApi.getToken()) || (localStorage.getItem('odb.adminToken') || '');
            } else {
              token = localStorage.getItem('odb.adminToken') || '';
            }
            adminToken.value = token;
            if (hasBridge && window.adminApi && typeof window.adminApi.setToken === 'function') await window.adminApi.setToken(token);
          } catch (e) {
            console.error('Failed to load admin token', e);
            adminToken.value = localStorage.getItem('odb.adminToken') || '';
          }
        }

        async function saveAdminToken() {
          try {
            localStorage.setItem('odb.adminToken', adminToken.value || '');
            if (hasBridge && window.adminApi && typeof window.adminApi.setToken === 'function') await window.adminApi.setToken(adminToken.value || '');
            showToast('Admin token saved');
          } catch (e) { showToast('Failed to save admin token'); }
        }

        async function clearAdminToken() {
          adminToken.value = '';
          try {
            localStorage.removeItem('odb.adminToken');
            if (hasBridge && window.adminApi && typeof window.adminApi.setToken === 'function') await window.adminApi.setToken('');
            showToast('Admin token cleared');
          } catch (e) { showToast('Failed to clear admin token'); }
        }

        function showAllEvents() {
          if (!monitorSettings.value.perEventVisible) monitorSettings.value.perEventVisible = {};
          Object.keys(monitorSettings.value.perEventVisible).forEach(k => { monitorSettings.value.perEventVisible[k] = true; });
        }

        function hideAllEvents() {
          if (!monitorSettings.value.perEventVisible) monitorSettings.value.perEventVisible = {};
          Object.keys(monitorSettings.value.perEventVisible).forEach(k => { monitorSettings.value.perEventVisible[k] = false; });
        }

        async function resetMonitorSettings() {
          monitorSettings.value = JSON.parse(JSON.stringify(defaultMonitorSettings));
          await saveMonitorSettings();
        }

        function eventKey(ev) { try { return String(ev).split(':').pop() || String(ev); } catch { return String(ev); } }
        // derive a normalized event type key used for visibility and per-event limits
        function eventTypeKey(ev) { try { return eventType(ev); } catch { return eventKey(ev); } }

        function pushMonitor(entry) {
          const key = eventTypeKey(entry.event);
          // skip if this event type is hidden
          try {
            if (monitorSettings.value && monitorSettings.value.perEventVisible && monitorSettings.value.perEventVisible[key] === false) return;
          } catch { }
          // bits threshold for cheers
          try {
            if (key === 'cheer') {
              const bits = Number((entry.payload && (entry.payload.bits ?? entry.payload.bitAmount)) || entry.bits || 0) || 0;
              if (bits < (monitorSettings.value.bitsThreshold || 0)) return;
            }
          } catch { /* ignore */ }

          // enforce per-event max (remove oldest matching entries)
          const limit = (monitorSettings.value.perEventMax && (monitorSettings.value.perEventMax[key] ?? monitorSettings.value.perEventMax['default'])) ?? 200;
          if (typeof limit === 'number' && limit >= 0) {
            let count = monitorFeed.value.filter(m => eventKey(m.event) === key).length;
            while (count >= limit) {
              let removed = false;
              for (let i = monitorFeed.value.length - 1; i >= 0; i--) {
                if (eventKey(monitorFeed.value[i].event) === key) { monitorFeed.value.splice(i, 1); removed = true; count--; break; }
              }
              if (!removed) break;
            }
          }

          monitorFeed.value.unshift(entry);

          // enforce total max
          const totalMax = Number(monitorSettings.value.totalMax || 500) || 500;
          while (monitorFeed.value.length > totalMax) monitorFeed.value.pop();
        }

        if (hasBridge && window.monitorApi) {
          window.monitorApi.onEvent((entry) => {
            const summary = eventSummary(entry.event, entry.payload);
            pushMonitor({ text: summary, ts: entry.timestamp, event: entry.event, payload: entry.payload });
          });
        }

        function clearMonitor() { monitorFeed.value = []; showToast('Monitor cleared'); }

        function eventLabel(ev) {
          const key = eventType(ev);
          const labels = {
            streamOnline: 'Stream online',
            streamOffline: 'Stream offline',
            raid_outgoing: 'Outgoing raid',
            goal_begin: 'Goal started',
            goal_progress: 'Goal progress',
            goal_end: 'Goal ended'
          };
          return labels[key] || key.replace(/[_-]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
        }

        function eventSummary(ev, payload) {
          const key = eventType(ev);
          const details = payload && typeof payload === 'object' && !Array.isArray(payload) ? payload : {};
          const broadcaster = details.broadcaster;
          const actor = details.user || details.gifter || details.raider;
          const channel = broadcaster ? ` in ${broadcaster}'s channel` : '';

          switch (key) {
            case 'chat':
              return `${details.displayName || details.user || details.username || 'Viewer'}: ${details.text ?? details.message ?? 'sent a message'}`;
            case 'follow':
              return `${actor || 'Someone'} followed${channel}.`;
            case 'subscription':
              const tier = { 1000: 1, 2000: 2, 3000: 3 }[Number(details.tier)];
              return `${actor || 'Someone'} subscribed${channel}${tier ? ` (Tier ${tier})` : ''}.`;
            case 'resub':
              return `${actor || 'Someone'} resubscribed${channel}${details.months ? ` for ${details.months} months` : ''}.`;
            case 'gift':
              return `${details.gifter || 'Someone'} gifted ${details.amount || 1} subscription${Number(details.amount) === 1 ? '' : 's'}${channel}.`;
            case 'cheer':
              return `${actor || 'Someone'} cheered ${details.bits || 0} bits${channel}${details.message ? `: “${details.message}”` : '.'}`;
            case 'raid':
              return `${details.raider || 'A channel'} raided ${broadcaster || 'the channel'}${details.viewers != null ? ` with ${details.viewers} viewers` : ''}.`;
            case 'raid_outgoing':
              return `${broadcaster || 'The channel'} raided ${details.target || 'another channel'}${details.viewers != null ? ` with ${details.viewers} viewers` : ''}.`;
            case 'redemption':
              return `${actor || 'Someone'} redeemed ${details.reward || 'a reward'}${details.cost != null ? ` for ${details.cost} points` : ''}${channel}${details.message ? `: “${details.message}”` : '.'}`;
            case 'streamOnline':
              return `${broadcaster || 'The channel'} is live.`;
            case 'streamOffline':
              return `${broadcaster || 'The channel'} has ended the stream.`;
            case 'goal_begin':
            case 'goal_progress':
            case 'goal_end': {
              const goalTypes = { follow: 'follower', subscription: 'subscriber', bits: 'bit' };
              const goalName = goalTypes[String(details.type || '').toLowerCase()] || String(details.type || 'community');
              const current = Number(details.current);
              const target = Number(details.target);
              const progress = Number.isFinite(current) && Number.isFinite(target)
                ? `${current} of ${target}${target > 0 ? ` (${Math.min(100, Math.round(current / target * 100))}%)` : ''}`
                : 'progress updated';
              const action = key === 'goal_begin' ? 'started' : key === 'goal_end' ? (current >= target ? 'completed' : 'ended') : 'progress';
              return `${broadcaster ? `${broadcaster}'s ` : ''}${goalName} goal ${action}: ${progress}.`;
            }
            default: {
              const humanize = value => value.replace(/[_-]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
              const valueText = value => {
                if (value == null) return '';
                if (Array.isArray(value)) return value.map(valueText).filter(Boolean).join(', ');
                if (typeof value === 'object') {
                  return Object.entries(value).map(([name, nested]) => `${humanize(name)}: ${valueText(nested)}`).filter(Boolean).join(', ');
                }
                return String(value);
              };
              const fields = Object.entries(details)
                .filter(([name, value]) => name !== 'broadcaster' && value != null && typeof value !== 'object')
                .map(([name, value]) => `${humanize(name)}: ${valueText(value)}`);
              if (broadcaster) fields.unshift(`Channel: ${broadcaster}`);
              return fields.length ? fields.join(' · ') : 'Event received.';
            }
          }
        }

        function eventType(ev) {
          const s = String(ev || '');
          const parts = s.split(':');
          if (parts.length === 1) return parts[0] || 'unknown';
          if (parts[0] === 'chat') return 'chat';
          if (parts[0].startsWith('eventsub')) return parts[1] || parts[0];
          return parts[1] || parts[0];
        }

        function eventIcon(ev) {
          const k = eventType(ev);
          const map = {
            chat: '💬', follow: '➕', subscription: '⭐', resub: '🔁', gift: '🎁', cheer: '✨', raid: '🚩',
            redemption: '🎯', goal: '🏆', goal_begin: '🏆', goal_progress: '🏆', goal_end: '🏆',
            warning: '⚠️', streamOnline: '🟢', streamOffline: '⚫️', default: '•'
          };
          return map[k] || map.default;
        }

        function eventColor(ev) {
          const k = eventType(ev);
          const map = {
            chat: 'rgba(255, 255, 255, 0.02)', follow: 'rgba(127, 231, 196, 0.10)',
            subscription: 'rgba(243, 185, 95, 0.12)', resub: 'rgba(243, 185, 95, 0.12)',
            gift: 'rgba(180, 139, 255, 0.12)', cheer: 'rgba(255, 93, 93, 0.12)',
            raid: 'rgba(110, 170, 255, 0.12)', redemption: 'rgba(127, 231, 196, 0.10)',
            goal: 'rgba(243, 185, 95, 0.12)', goal_begin: 'rgba(243, 185, 95, 0.12)',
            goal_progress: 'rgba(243, 185, 95, 0.12)', goal_end: 'rgba(243, 185, 95, 0.12)',
            warning: 'rgba(243, 185, 95, 0.12)',
            streamOnline: 'rgba(127, 231, 196, 0.12)', streamOffline: 'rgba(255, 93, 93, 0.12)',
            default: 'var(--panel-raised)'
          };
          return map[k] || map.default;
        }

        function esPrevPage() { if (esPage.value > 1) { esPage.value--; } }
        function esNextPage() { if (esPage.value < esTotalPages.value) { esPage.value++; } }

        function setStatus(s) { status.value = s; page.value = 1; selected.value = new Set(); loadQueue(); }

        function toggleSelect(id) {
          selected.value.has(id) ? selected.value.delete(id) : selected.value.add(id);
          selected.value = new Set(selected.value);
        }

        async function requeue(ids) {
          if (!hasBridge) { showToast('Requeue requires the Electron shell'); return; }
          await window.adminApi.fetch('/api/v1/admin/webhooks/requeue', { method: 'POST', body: JSON.stringify({ ids }) });
          showToast(`Requeued ${ids.length} item${ids.length > 1 ? 's' : ''}`);
          selected.value = new Set();
          await loadQueue();
        }

        async function remove(ids) {
          if (!hasBridge) { showToast('Delete requires the Electron shell'); return; }
          await window.adminApi.fetch('/api/v1/admin/webhooks', { method: 'DELETE', body: JSON.stringify({ ids }) });
          showToast(`Deleted ${ids.length} item${ids.length > 1 ? 's' : ''}`);
          selected.value = new Set();
          await loadQueue();
        }

        const totalPages = computed(() => Math.max(1, Math.ceil(total.value / limit)));

        function fmtTime(iso) {
          return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // API health is now part of the botStatus object and checked in loadStatus

        // ---- Bot status panel ----
        const botStatus = ref({ pid: null, startedAt: null, dbConnected: false, chatConnected: false });
        const liveUptimeSeconds = ref(0);

        function formatUptime(totalSeconds) {
          const s = Math.max(0, Math.floor(totalSeconds));
          const d = Math.floor(s / 86400);
          const h = Math.floor((s % 86400) / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = s % 60;
          if (d > 0) return `${d}d ${h}h ${m}m`;
          if (h > 0) return `${h}h ${m}m`;
          if (m > 0) return `${m}m ${sec}s`;
          return `${sec}s`;
        }

        async function loadStatus() {
          if (!hasBridge) {
            // demo fallback so this is still previewable outside Electron
            botStatus.value = {
              pid: 12345,
              startedAt: new Date(Date.now() - 3 * 3600 * 1000).toISOString(),
              dbConnected: true,
              chatConnected: true,
              api: true
            };
            liveUptimeSeconds.value = 3 * 3600;
            return;
          }
          try {
            const res = await window.adminApi.fetch('/api/v1/admin/status');
            botStatus.value = res;
            liveUptimeSeconds.value = res.uptimeSeconds;
          } catch (err) {
            botStatus.value = { ...botStatus.value, dbConnected: false, chatConnected: false };
          }
        }

        let refreshInterval = null;
        onMounted(() => {
          if (hasBridge) {
            window.twitchApi.onSignupComplete((result) => {
              if (result?.result?.error) {
                showToast(result.result.error);
                return;
              }

              if (result.type === 'bot') {
                botSignup.value = result.result;
              } else {
                userSignup.value = result.result;
              }
              showToast(`Signed up ${result.type} as ${result.result?.username}`);
              loadSignupAccounts();
              loadChannels();
            });
            loadChannels();
            loadQueue();
            loadEventSubs();
            // health is checked as part of loadStatus; no separate header health polling
          }

          loadStatus();
          setInterval(loadStatus, 120000);
          setInterval(() => { liveUptimeSeconds.value += 1; }, 1000);

          // inform main process of initial visibility preferences so it can filter upstream
          try { if (hasBridge && window.monitorApi && typeof window.monitorApi.setVisibility === 'function') window.monitorApi.setVisibility(JSON.stringify(monitorSettings.value.perEventVisible || {})); } catch (e) { /* ignore */ }

          // Auto-refresh every minute: refresh Economy if active, otherwise refresh dashboard panels
          refreshInterval = window.setInterval(() => {
            try {
              if (activeView.value === 'economy') {
                loadEconomy();
              } else {
                // Dashboard view: refresh webhooks and eventsubs
                loadQueue();
                loadEventSubs();
              }
            } catch (e) { console.debug('Auto-refresh error', e); }
          }, 60 * 1000);

          // Load the token before requesting the settings API.
          loadAdminToken().then(async () => {
            await Promise.all([loadMonitorSettings(), loadSignupAccounts()]);
          }).catch(e => console.error('Failed to initialize dashboard settings', e));
        });

        onUnmounted(() => {
          if (refreshInterval) clearInterval(refreshInterval);
        });

        return {
          userSignup, botSignup, activeView, channels, joinInput, status, items, page, total, totalPages, queueTestSubmitting,
          selected, toast, signUp, signOutAccount, revokeAccount, accountActionPending, joinChannel, partChannel, setStatus, toggleSelect,
          requeue, remove, queueDryRunSamples, fmtTime, limit, botStatus, liveUptimeSeconds, formatUptime, openLogs,
          // Live monitor
          monitorFeed, chatFeed, eventMonitorFeed, monitorSettings, settingsError, loadMonitorSettings, saveMonitorSettings, resetMonitorSettings, clearMonitor, eventType, eventLabel, eventIcon, eventColor, showAllEvents, hideAllEvents,
          // EventSub panel bindings
          esItems, esTotal, esPage, esPageItems, esTotalPages, loadEventSubs, esPrevPage, esNextPage,
          // Economy
          economyAccounts, economyTotal, economyPage, economyLimit, economyPageCount, economyError, economyLoading, loadEconomy,
          editAccount, deleteAccount, // expose edit/delete handlers to template
          // modal helpers/state
          modalVisible, modalMessage, showModal, hideModal, showConfirmModal,
          // Admin token controls
          adminToken, saveAdminToken, clearAdminToken,
          prevPage: () => { if (page.value > 1) { page.value--; loadQueue(); } },
          nextPage: () => { if (page.value < totalPages.value) { page.value++; loadQueue(); } },
        };
      },
      template: `
    <header>
      <div class="brand">
        <span class="mark">ODB</span>
        <div>
          <h1>OpenDevBot Control Room</h1>
          <div class="sub">local admin · localhost</div>
        </div>
      </div>
      <div class="main-nav">
        <button class="nav-item" :class="{ active: activeView === 'dashboard' }" @click="activeView='dashboard'">Dashboard</button>
        <button class="nav-item" :class="{ active: activeView === 'live' }" @click="activeView='live'">Live</button>
        <button class="nav-item" :class="{ active: activeView === 'economy' }" @click="(activeView='economy', loadEconomy())">Economy</button>
        <button class="nav-item" :class="{ active: activeView === 'settings' }" @click="(activeView='settings', loadMonitorSettings())">Settings</button>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost" @click="openLogs">Logs</button>
      </div>
    </header>

    <main v-if="activeView === 'dashboard'">
      <div class="col-left">
      <div class="signup-status">
        <div v-if="userSignup" class="user-chip">
          <span>streamer:&nbsp;<b>{{ userSignup.username }}</b></span>
          <button class="btn btn-ghost account-action" :disabled="!!accountActionPending" @click="signOutAccount('streamer')">Sign Out</button>
        </div>
        <button class="btn btn-primary" v-else @click="signUp('user')">Sign Up (User)</button>
        <div v-if="botSignup" class="user-chip">
          <span>bot:&nbsp;<b>{{ botSignup.username }}</b></span>
          <button class="btn btn-ghost account-action" :disabled="!!accountActionPending" @click="signOutAccount('bot')">Sign Out</button>
        </div>
        <button class="btn btn-ghost" v-else @click="signUp('bot')">Sign Up Bot</button>
      </div>
      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="eyebrow">Health</div>
            <h2>Bot Status</h2>
          </div>
        </div>
        <div class="panel-body">
          <div class="status-grid">
            <div class="status-row">
              <span class="label">Chat connection</span>
              <span class="status-dot-row">
                <span class="status-dot" :class="botStatus.chatConnected ? 'up' : 'down'"></span>
                <span class="value">{{ botStatus.chatConnected ? 'connected' : 'disconnected' }}</span>
              </span>
            </div>
            <div class="status-row">
              <span class="label">Database</span>
              <span class="status-dot-row">
                <span class="status-dot" :class="botStatus.dbConnected ? 'up' : 'down'"></span>
                <span class="value">{{ botStatus.dbConnected ? 'connected' : 'disconnected' }}</span>
              </span>
            </div>
            <!-- API status removed: /api/v1/admin/status indicates API reachability -->
            <div class="status-row">
              <span class="label">Uptime</span>
              <span class="value">{{ formatUptime(liveUptimeSeconds) }}</span>
            </div>
            <div class="status-row">
              <span class="label">Last restart</span>
              <span class="value">{{ botStatus.startedAt ? fmtTime(botStatus.startedAt) : '—' }}</span>
            </div>
            <div class="status-row">
              <span class="label">Process PID</span>
              <span class="value">{{ botStatus.pid ?? '—' }}</span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="eyebrow">Presence</div>
            <h2>Joined Channels</h2>
          </div>
        </div>
        <div class="panel-body">
          <div class="join-row">
            <input v-model="joinInput" placeholder="channel name" @keyup.enter="joinChannel" />
            <button class="btn btn-ghost" @click="joinChannel">Join</button>
          </div>
          <div v-if="channels.length" class="channel-list">
            <div class="channel-row" v-for="c in channels" :key="c">
              <span class="channel-name"><span class="dot" style="width:6px;height:6px;border-radius:50%;"></span>#{{ c }}</span>
              <button class="icon-btn" @click="partChannel(c)">part</button>
            </div>
          </div>
          <div v-else class="empty">No channels joined yet</div>
        </div>
      </section>
      </div>

      <div class="col-right">
      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="eyebrow">Discord</div>
            <h2>Webhook Queue</h2>
          </div>
          <div class="tabs">
            <button class="tab" :class="{ active: status==='pending', pending: status==='pending' }" @click="setStatus('pending')">pending</button>
            <button class="tab" :class="{ active: status==='processing' }" @click="setStatus('processing')">processing</button>
            <button class="tab" :class="{ active: status==='sent', sent: status==='sent' }" @click="setStatus('sent')">sent</button>
            <button class="tab" :class="{ active: status==='failed', failed: status==='failed' }" @click="setStatus('failed')">failed</button>
          </div>
        </div>
        <div class="panel-body">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <button class="btn btn-ghost" :disabled="queueTestSubmitting" @click="queueDryRunSamples">
              {{ queueTestSubmitting ? 'Queueing samples…' : 'Queue dry-run samples' }}
            </button>
            <span class="mono-id">Dev/debug only; samples stay pending in SQLite and are never sent.</span>
          </div>
          <table v-if="items.length">
            <thead>
              <tr>
                <th style="width:24px"></th>
                <th>Event</th>
                <th>Status</th>
                <th>Received</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="it in items" :key="it._id">
                <td><input type="checkbox" :checked="selected.has(it._id)" @change="toggleSelect(it._id)" /></td>
                <td>
                  {{ it.event || 'Webhook notification' }}
                  <span v-if="it.dryRun" class="badge pending">dry run</span><br/>
                  <span class="mono-id">{{ it._id }}</span>
                </td>
                <td><span class="badge" :class="it.status">{{ it.status }}</span></td>
                <td class="mono-id">{{ fmtTime(it.createdAt) }}</td>
                <td>
                  <div class="row-actions">
                    <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" @click="requeue([it._id])">requeue</button>
                    <button class="btn btn-danger" style="padding:6px 10px;font-size:12px" @click="remove([it._id])">delete</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No {{ status }} items</div>

          <div class="queue-foot">
            <span class="page-info">page {{ page }} / {{ totalPages }} · {{ total }} total</span>
            <div class="pager">
              <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" :disabled="page<=1" @click="prevPage">prev</button>
              <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" :disabled="page>=totalPages" @click="nextPage">next</button>
            </div>
          </div>

        </div>
      </section>

      <!-- EventSub Subscriptions panel (separate section under Discord Webhook Queue) -->
      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="eyebrow">Twitch</div>
            <h2>EventSub Subscriptions</h2>
          </div>
          <div class="tabs">
            <button class="tab" @click="loadEventSubs">refresh</button>
          </div>
        </div>
        <div class="panel-body">
          <table v-if="esPageItems.length">
            <thead>
              <tr>
                <th>Subscription ID</th>
                <th>Auth User</th>
                <th>Present</th>
                <th>Retry Status</th>
                <th>Attempts</th>
                <th>Last Error</th>
                <th>Next Retry</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="it in esPageItems" :key="it.subscriptionId + ':' + it.authUserId">
                <td class="mono-id">{{ it.subscriptionId }}</td>
                <td class="mono-id">{{ it.authUserId }}</td>
                <td><span :class="it.present ? 'status-dot up' : 'status-dot down'"> </span> {{ it.present ? 'active' : 'missing' }}</td>
                <td>{{ it.retryStatus }}</td>
                <td class="mono-id">{{ it.attempts }}</td>
                <td class="mono-id">{{ it.lastError || '' }}</td>
                <td class="mono-id">{{ it.nextRetryAt ? new Date(it.nextRetryAt).toLocaleString() : '' }}</td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No subscriptions found</div>
          <div class="queue-foot">
            <span class="page-info">page {{ esPage }} / {{ esTotalPages }} · {{ esTotal }} total</span>
            <div class="pager">
              <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" :disabled="esPage<=1" @click="esPrevPage">prev</button>
              <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" :disabled="esPage>=esTotalPages" @click="esNextPage">next</button>
            </div>
          </div>
        </div>
      </section>

      </div>

    </main>

    <!-- Live monitor view -->
    <main v-if="activeView === 'live'" class="live-main">
      <div style="width:100%;max-width:1180px;margin:0 auto;padding:26px 32px 40px;">
        <div class="live-grid">
          <section class="panel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">Live · {{ chatFeed.length }} messages</div>
                <h2>Chat</h2>
              </div>
            </div>
            <div class="panel-body live-feed">
              <div v-if="chatFeed.length">
                <div v-for="(m, idx) in chatFeed" :key="idx"
                  :style="{background: 'rgba(255,255,255,0.02)', padding: '10px 12px', marginBottom: '6px', borderRadius: '6px', border: '1px solid rgba(255,255,255,0.03)'}">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <div style="font-size:16px">{{ eventIcon(m.event) }}</div>
                    <div style="flex:1;line-height:1.1">
                      <div style="font-weight:600;color:#ffffff;font-size:13px">{{ (m.text.split(':')[0]) || '' }} <span style="font-weight:400;color:#9aa0a6;margin-left:8px;font-size:11px">{{ m.ts }}</span></div>
                      <div style="margin-top:6px;color:#e6e6e6;font-size:13px;white-space:pre-wrap">{{ (m.text.split(':').slice(1).join(':')).trim() }}</div>
                    </div>
                  </div>
                </div>
              </div>
              <div v-else class="empty">No chat messages yet</div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">Live · {{ eventMonitorFeed.length }} events</div>
                <h2>Event Monitor</h2>
              </div>
            </div>
            <div class="panel-body live-feed">
              <div v-if="eventMonitorFeed.length">
                <div v-for="(m, idx) in eventMonitorFeed" :key="idx"
                  :style="{background: eventColor(m.event), padding: '10px 12px', marginBottom: '6px', borderRadius: '6px', border: '1px solid var(--line)'}">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                    <div style="font-size:16px">{{ eventIcon(m.event) }}</div>
                    <div style="flex:1"><strong style="color:var(--text)">{{ eventLabel(m.event) }}</strong> <span style="margin-left:8px;color:var(--text-dim)">{{ m.ts }}</span></div>
                  </div>
                  <div style="font-size:13px;color:var(--text);white-space:pre-wrap">{{ m.text }}</div>
                </div>
              </div>
              <div v-else class="empty">No events yet</div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Settings view -->
    <main v-if="activeView === 'settings'">
      <div style="max-width:820px;margin:0 auto;padding:26px 32px 40px;">
        <section class="panel">
          <div class="panel-head">
            <div>
              <div class="eyebrow">Settings</div>
              <h2>Monitor Filters</h2>
            </div>
            <div class="tabs">
              <button class="tab">monitor</button>
            </div>
          </div>
          <div class="panel-body">
            <div v-if="settingsError" class="empty" style="color:var(--danger)">Failed to load/save settings: {{ settingsError }}</div>
            <div style="display:flex;gap:18px;align-items:flex-start;">
              <div style="flex:1">
                <label>Bits threshold (min bits to show)</label>
                <input type="number" v-model.number="monitorSettings.bitsThreshold" style="width:120px;margin-top:8px;display:block" />
                <label style="margin-top:12px;display:block">Total monitor items limit</label>
                <input type="number" v-model.number="monitorSettings.totalMax" style="width:120px;margin-top:8px;display:block" />
              </div>
              <div style="flex:2">
                <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
                  <strong>Per-event limits</strong>
                  <div>
                    <button class="btn btn-ghost" @click="showAllEvents">Show all</button>
                    <button class="btn btn-ghost" @click="hideAllEvents">Hide all</button>
                  </div>
                </div>
                <div v-for="(val, key) in monitorSettings.perEventMax" :key="key" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <div style="width:140px;text-transform:capitalize">{{ key }}</div>
                  <input type="number" v-model.number="monitorSettings.perEventMax[key]" style="width:100px" />
                  <div style="margin-left:12px;display:flex;align-items:center;gap:6px">
                    <label style="font-size:12px;color:var(--text-dim)">show</label>
                    <input type="checkbox" v-model="monitorSettings.perEventVisible[key]" />
                  </div>
                </div>
              </div>
            </div>
              <div style="margin-top:18px;display:flex;gap:8px;align-items:center">
                <button class="btn btn-primary" @click="saveMonitorSettings">Save</button>
                <button class="btn btn-ghost" @click="resetMonitorSettings">Reset</button>
                <button class="btn btn-ghost" @click="clearMonitor">Clear Monitor</button>
              </div>

              <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;">
                <strong style="display:block;margin-bottom:8px">Twitch Accounts</strong>
                <div class="status-row">
                  <span class="label">Streamer</span>
                  <span class="value" style="display:flex;align-items:center;gap:10px">
                    {{ userSignup ? userSignup.username : 'Not signed in' }}
                    <button v-if="userSignup" class="btn btn-ghost account-action" :disabled="!!accountActionPending" @click="revokeAccount('streamer')">Revoke</button>
                  </span>
                </div>
                <div class="status-row">
                  <span class="label">Bot</span>
                  <span class="value" style="display:flex;align-items:center;gap:10px">
                    {{ botSignup ? botSignup.username : 'Not signed in' }}
                    <button v-if="botSignup" class="btn btn-ghost account-action" :disabled="!!accountActionPending" @click="revokeAccount('bot')">Revoke</button>
                  </span>
                </div>
                <div style="margin-top:8px;font-size:12px;color:var(--text-dim)">Revoke invalidates the Twitch access and refresh tokens and removes the saved account from this app.</div>
              </div>
          
              <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;">
                <strong style="display:block;margin-bottom:8px">Admin API Token</strong>
                <div style="display:flex;gap:8px;align-items:center">
                  <input type="text" v-model="adminToken" placeholder="(leave empty for none)" style="flex:1;background:var(--panel-raised);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font-family:var(--mono)" />
                  <button class="btn btn-primary" @click="saveAdminToken">Save</button>
                  <button class="btn btn-ghost" @click="clearAdminToken">Clear</button>
                </div>
                <div style="margin-top:8px;font-size:12px;color:var(--text-dim)">Setting this token will be used by the renderer to authenticate admin requests.</div>
              </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Economy view -->
    <main v-if="activeView === 'economy'">
      <div style="max-width:1180px;margin:0 auto;padding:26px 32px 40px;">
        <section class="panel">
          <div class="panel-head">
            <div>
              <div class="eyebrow">Economy</div>
              <h2>Accounts</h2>
            </div>
            <div class="tabs">
              <button class="tab" @click="loadEconomy">refresh</button>
            </div>
          </div>
          <div class="panel-body">
            <div v-if="economyLoading" class="empty">Loading economy accounts…</div>
            <div v-else-if="economyError" class="empty" style="color:var(--danger)">Failed to load economy accounts: {{ economyError }}</div>
            <table v-else-if="economyAccounts.length">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Balance</th>
                  <th>Actions</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="acc in economyAccounts" :key="acc.userId">
                  <td class="mono-id">{{ acc.userId }}</td>
                  <td>
                    {{ (acc.balance && typeof acc.balance === 'object' && acc.balance.bank != null)
                        ? (String(acc.balance.bank) + ' / ' + String(acc.balance.wallet ?? 0))
                        : String(acc.balance ?? '') }}
                  </td>
                  <td>
                    <button class="btn small" @click="editAccount(acc)">Edit</button>
                    <button class="btn small danger" @click="deleteAccount(acc.userId)">Delete</button>
                  </td>
                  <td class="mono-id">{{ acc.updatedAt ? new Date(acc.updatedAt).toLocaleString() : '—' }}</td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">No economy accounts found in the SQLite database.</div>
            <div v-if="!economyLoading && !economyError && economyTotal > economyLimit" style="display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px">
              <button class="btn btn-ghost" :disabled="economyPage <= 1" @click="economyPage--; loadEconomy()">Previous</button>
              <span class="mono-id">Page {{ economyPage }} of {{ economyPageCount }} ({{ economyTotal }} accounts)</span>
              <button class="btn btn-ghost" :disabled="economyPage >= economyPageCount" @click="economyPage++; loadEconomy()">Next</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="toast" v-if="toast">{{ toast }}</div>
  `
    }).mount('#app');
  </script>

  <!-- Simple modal markup -->
  <div id="admin-modal"
    style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:1000;">
    <div style="background:rgba(0,0,0,0.75); position:absolute; inset:0;"></div>
    <div
      style="position:relative; background:var(--panel); color:var(--text); padding:18px; width:420px; border-radius:10px; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,0.6);">
      <div id="admin-modal-message" style="color:var(--text-dim); font-size:14px;"></div>
      <div style="margin-top:14px; text-align:right;">
        <button id="admin-modal-cancel" class="btn" style="margin-right:8px;">Cancel</button>
        <button id="admin-modal-ok" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>
  <script>
    // Simple bridge between modal DOM and Vue event flow
    (function () {
      const modal = document.getElementById('admin-modal');
      const msg = document.getElementById('admin-modal-message');
      const ok = document.getElementById('admin-modal-ok');
      const cancel = document.getElementById('admin-modal-cancel');
      function show(m) { msg.textContent = String(m || ''); modal.style.display = 'flex'; }
      function hide() { modal.style.display = 'none'; msg.textContent = ''; }
      ok.addEventListener('click', () => { document.dispatchEvent(new CustomEvent('adminModalOk')); hide(); });
      cancel.addEventListener('click', () => { document.dispatchEvent(new CustomEvent('adminModalCancel')); hide(); });
      // expose helpers for Vue
      window.adminModal = { show, hide };
      // wire to Vue reactive modal state
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => { });
      });
    })();
  </script>
  <!-- Edit modal markup -->
  <div id="admin-edit-modal"
    style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:1000;">
    <div style="background:rgba(0,0,0,0.75); position:absolute; inset:0;"></div>
    <div
      style="position:relative; background:var(--panel); color:var(--text); padding:18px; width:420px; border-radius:10px; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,0.6);">
      <div style="font-weight:700;margin-bottom:6px;color:var(--text-dim)">Edit Account</div>
      <div id="admin-edit-user" style="font-size:13px;color:var(--text-dim);margin-bottom:8px"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label style="width:80px;font-family:var(--mono);color:var(--text-dim)">Bank</label>
        <input id="admin-edit-bank" type="number"
          style="flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-raised);color:var(--text)" />
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label style="width:80px;font-family:var(--mono);color:var(--text-dim)">Wallet</label>
        <input id="admin-edit-wallet" type="number"
          style="flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-raised);color:var(--text)" />
      </div>
      <div style="text-align:right;margin-top:12px">
        <button id="admin-edit-cancel" class="btn" style="margin-right:8px;">Cancel</button>
        <button id="admin-edit-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const modal = document.getElementById('admin-edit-modal');
      const userEl = document.getElementById('admin-edit-user');
      const bankInput = document.getElementById('admin-edit-bank');
      const walletInput = document.getElementById('admin-edit-wallet');
      const ok = document.getElementById('admin-edit-save');
      const cancel = document.getElementById('admin-edit-cancel');
      let pendingResolve = null;
      function show(opts) {
        userEl.textContent = `User: ${opts.userId}`;
        bankInput.value = String(opts.bank || 0);
        walletInput.value = String(opts.wallet || 0);
        modal.style.display = 'flex';
        return new Promise(resolve => {
          pendingResolve = resolve;
        });
      }
      function hide() { modal.style.display = 'none'; if (pendingResolve) { pendingResolve(null); pendingResolve = null; } }
      ok.addEventListener('click', () => {
        const bank = Number(bankInput.value || 0);
        const wallet = Number(walletInput.value || 0);
        if (!Number.isFinite(bank) || !Number.isFinite(wallet)) { alert('Invalid amounts'); return; }
        modal.style.display = 'none';
        if (pendingResolve) { pendingResolve({ bank, wallet }); pendingResolve = null; }
      });
      cancel.addEventListener('click', () => { modal.style.display = 'none'; if (pendingResolve) { pendingResolve(null); pendingResolve = null; } });
      window.adminModalEdit = { show, hide };
    })();
  </script>
</body>

</html>
