<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
  <title>OpenDevBot — Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #14121B;
      --panel: #1B1826;
      --panel-raised: #221E30;
      --line: #322C42;
      --text: #EDE9F5;
      --text-dim: #9A93AE;
      --accent: #FF5D5D;
      --accent-soft: rgba(255, 93, 93, 0.14);
      --ok: #7FE7C4;
      --ok-soft: rgba(127, 231, 196, 0.12);
      --warn: #F3B95F;
      --warn-soft: rgba(243, 185, 95, 0.12);
      --debug: #8B93F0;
      --debug-soft: rgba(139, 147, 240, 0.12);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Manrope', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::selection {
      background: var(--accent-soft);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand .mark {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.4px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
    }

    .tab.active {
      color: var(--bg);
      background: var(--text-dim);
    }

    .tab.active.warn {
      background: var(--warn);
    }

    .tab.active.error {
      background: var(--accent);
    }

    .tab.active.debug {
      background: var(--debug);
    }

    .tab .count {
      opacity: 0.7;
      margin-left: 4px;
    }

    .btn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 12px;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    label.autoscroll {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    main {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 10px 0;
    }

    .line {
      display: flex;
      gap: 10px;
      padding: 4px 18px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.5;
      border-bottom: 1px solid rgba(50, 44, 66, 0.35);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line:hover {
      background: var(--panel-raised);
    }

    .line .ts {
      color: var(--text-dim);
      flex: 0 0 auto;
    }

    .line .badge {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      height: fit-content;
    }

    .line .msg {
      flex: 1 1 auto;
    }

    .line.debug .badge {
      color: var(--debug);
      background: var(--debug-soft);
    }

    .line.info .badge {
      color: var(--text-dim);
      background: rgba(154, 147, 174, 0.12);
    }

    .line.warn .badge {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .line.error .badge {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .line.error .msg {
      color: #FFC9C9;
    }

    .empty {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 13px;
      text-align: center;
      padding: 60px 20px;
    }

    footer {
      flex: 0 0 auto;
      padding: 8px 18px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;

    createApp({
      setup() {
        const hasBridge = !!window.logsApi;
        const entries = ref([]);
        const filter = ref('all');
        const autoScroll = ref(true);
        const mainRef = ref(null);

        function pushEntry(entry) {
          entries.value.push(entry);
          if (entries.value.length > 2000) entries.value.shift();
          if (autoScroll.value) {
            nextTick(() => {
              const el = mainRef.value;
              if (el) el.scrollTop = el.scrollHeight;
            });
          }
        }

        async function loadHistory() {
          if (!hasBridge) {
            // demo fallback for previewing outside Electron
            entries.value = [
              { level: 'info', message: 'Server listening on http://localhost:3000', timestamp: new Date().toISOString() },
              { level: 'warn', message: 'admin:fetch /api/v1/chat/part returned 400', timestamp: new Date().toISOString() },
              { level: 'error', message: 'Failed to refresh token for user u1: invalid_grant', timestamp: new Date().toISOString() },
            ];
            return;
          }
          entries.value = await window.logsApi.getHistory();
          nextTick(() => {
            const el = mainRef.value;
            if (el) el.scrollTop = el.scrollHeight;
          });
        }

        function clear() {
          entries.value = [];
        }

        function setFilter(f) { filter.value = f; }

        const filtered = computed(() => {
          if (filter.value === 'all') return entries.value;
          return entries.value.filter(e => e.level === filter.value);
        });

        const counts = computed(() => {
          const c = { debug: 0, info: 0, warn: 0, error: 0 };
          for (const e of entries.value) if (c[e.level] !== undefined) c[e.level]++;
          return c;
        });

        function fmtTime(iso) {
          return new Date(iso).toLocaleTimeString(undefined, { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        onMounted(async () => {
          await loadHistory();
          if (hasBridge) {
            window.logsApi.onNewLog(pushEntry);
          }
        });

        return { entries, filter, filtered, counts, autoScroll, mainRef, clear, setFilter, fmtTime };
      },
      template: `
        <header>
          <div class="brand">
            <span class="mark">ODB</span>
            <h1>Logs</h1>
          </div>
          <div class="controls">
            <div class="tabs">
              <button class="tab" :class="{ active: filter==='all' }" @click="setFilter('all')">all</button>
              <button class="tab" :class="{ active: filter==='debug', debug: filter==='debug' }" @click="setFilter('debug')">debug <span class="count">{{ counts.debug }}</span></button>
              <button class="tab" :class="{ active: filter==='info' }" @click="setFilter('info')">info <span class="count">{{ counts.info }}</span></button>
              <button class="tab" :class="{ active: filter==='warn', warn: filter==='warn' }" @click="setFilter('warn')">warn <span class="count">{{ counts.warn }}</span></button>
              <button class="tab" :class="{ active: filter==='error', error: filter==='error' }" @click="setFilter('error')">error <span class="count">{{ counts.error }}</span></button>
            </div>
            <label class="autoscroll">
              <input type="checkbox" v-model="autoScroll" /> auto-scroll
            </label>
            <button class="btn" @click="clear">Clear</button>
          </div>
        </header>

        <main ref="mainRef">
          <div v-if="filtered.length === 0" class="empty">No {{ filter === 'all' ? '' : filter }} log entries yet</div>
          <div v-for="(e, i) in filtered" :key="i" class="line" :class="e.level">
            <span class="ts">{{ fmtTime(e.timestamp) }}</span>
            <span class="badge">{{ e.level }}</span>
            <span class="msg">{{ e.message }}</span>
          </div>
        </main>

        <footer>
          <span>{{ entries.length }} entries buffered (last 500 kept in memory)</span>
          <span>{{ filtered.length }} shown</span>
        </footer>
      `
    }).mount('#app');
  </script>
</body>

</html>
